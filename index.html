<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tastiera delle Campane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:   #0b0e15;
    --bg-stone:  #161a23;
    --bg-iron:   #1f1d22;
    --brass:     #c9a35e;
    --brass-dim: #8a7340;
    --iron:      #6b6770;
    --text:      #e8e0cf;
    --text-dim:  #8a8377;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, #2a2233 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 110%, #1a1410 0%, transparent 60%),
      var(--bg-deep);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* sottile texture di rumore per atmosfera */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.78 0 0 0 0 0.65 0 0 0 0 0.4 0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/></svg>");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  .page {
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 3.5rem 1.25rem 3rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.6rem;
    padding-bottom: 1.8rem;
    border-bottom: 1px solid rgba(201, 163, 94, 0.18);
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(1.3rem, 4.2vw, 2.3rem);
    letter-spacing: 0.32em;
    color: var(--brass);
    text-shadow: 0 1px 0 rgba(0,0,0,0.5), 0 0 28px rgba(201, 163, 94, 0.18);
    margin-bottom: 0.7rem;
  }

  header p {
    font-style: italic;
    font-size: 1.02rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .octave {
    margin-bottom: 2.2rem;
    opacity: 0;
    animation: rise 0.7s ease-out forwards;
  }
  .octave:nth-child(1) { animation-delay: 0.05s; }
  .octave:nth-child(2) { animation-delay: 0.15s; }
  .octave:nth-child(3) { animation-delay: 0.25s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .octave-label {
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    color: var(--brass-dim);
    letter-spacing: 0.4em;
    margin-bottom: 0.9rem;
    padding-left: 0.85rem;
    border-left: 2px solid var(--brass-dim);
    text-transform: uppercase;
  }
  .octave-label .hint {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    text-transform: none;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-left: 0.6rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 0.55rem;
  }

  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(6, 1fr); gap: 0.45rem; }
    .page { padding-top: 2.2rem; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }

  .bell {
    position: relative;
    background: var(--bg-stone);
    border: 1px solid rgba(201, 163, 94, 0.14);
    border-radius: 3px;
    padding: 0.8rem 0.3rem 0.55rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s, background 0.18s, box-shadow 0.25s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .bell:hover {
    border-color: var(--brass);
    background: rgba(201, 163, 94, 0.07);
    transform: translateY(-2px);
    box-shadow: 0 6px 22px -6px rgba(201, 163, 94, 0.32);
  }
  .bell:active { transform: translateY(0); }

  .bell.sharp {
    background: var(--bg-iron);
    border-color: rgba(107, 103, 112, 0.3);
  }
  .bell.sharp:hover {
    border-color: var(--iron);
    background: rgba(107, 103, 112, 0.18);
    box-shadow: 0 6px 22px -6px rgba(107, 103, 112, 0.5);
  }

  .bell img {
    width: 34px;
    height: 34px;
    margin-bottom: 0.45rem;
    transform-origin: 50% 12%;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    transition: filter 0.2s;
  }
  .bell.natural img { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)) brightness(1.05); }

  .bell.ringing img { animation: sway 1.1s cubic-bezier(.4,0,.2,1); }
  .bell.ringing { box-shadow: 0 0 0 1px var(--brass), 0 6px 28px -4px rgba(201, 163, 94, 0.5); }
  .bell.ringing::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 3px;
    border: 1px solid var(--brass);
    animation: pulse 0.9s ease-out;
    pointer-events: none;
  }

  @keyframes sway {
    0%   { transform: rotate(0); }
    18%  { transform: rotate(-18deg); }
    36%  { transform: rotate(14deg); }
    54%  { transform: rotate(-9deg); }
    72%  { transform: rotate(5deg); }
    100% { transform: rotate(0); }
  }
  @keyframes pulse {
    0%   { transform: scale(1);    opacity: 0.9; }
    100% { transform: scale(1.18); opacity: 0;   }
  }

  .label {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--brass-dim);
    line-height: 1.25;
    text-align: center;
  }
  .bell.sharp .label { color: var(--text-dim); }
  .label sub { font-size: 0.65em; }
  .label .alt {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    text-transform: none;
    letter-spacing: 0;
    font-size: 0.62rem;
    opacity: 0.55;
    margin-top: 1px;
  }

  .controls {
    margin-top: 2.2rem;
    display: flex;
    justify-content: center;
    gap: 1rem;
  }
  button.stop {
    background: transparent;
    color: var(--brass);
    border: 1px solid var(--brass-dim);
    padding: 0.65rem 2rem;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }
  button.stop:hover {
    background: var(--brass);
    color: var(--bg-deep);
    box-shadow: 0 0 24px -4px var(--brass);
  }

  .status {
    margin-top: 1.4rem;
    text-align: center;
    font-size: 0.92rem;
    color: var(--text-dim);
    font-style: italic;
    min-height: 1.4em;
    transition: color 0.2s;
  }
  .status.error { color: #c98a8a; font-style: normal; }
  .status.ok    { color: var(--brass-dim); }

  footer {
    margin-top: 2.5rem;
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    opacity: 0.65;
    letter-spacing: 0.02em;
  }
  footer a { color: var(--brass-dim); }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Tastiera delle Campane</h1>
    <p>Tre ottave — dal DO<sub>2</sub> al SI<sub>4</sub></p>
  </header>

  <main id="keyboard"></main>

  <div class="controls">
    <button class="stop" id="stopAll">Ferma tutto</button>
  </div>

  <div class="status" id="status"></div>

  <footer>
    Audio e icone caricati da campanologia.org.
  </footer>
</div>

<script>
  // =====================================================================
  // CONFIGURAZIONE AUDIO
  //
  // Il pattern esatto dei nomi file usato dal simulatore di campanologia.org
  // non è documentato. Al primo click la pagina prova diverse convenzioni
  // (combinazioni di base path + naming) e usa la prima che restituisce
  // un audio caricabile, memorizzandola per i click successivi.
  //
  // Se nessuna combinazione funziona:
  //   1. apri DevTools → Network sulla pagina
  //      https://campanologia.org/simulatore-campane
  //   2. clicca una campana e copia l'URL del file audio scaricato
  //   3. aggiungi il pattern come prima voce di URL_BUILDERS sotto
  // =====================================================================

  const AUDIO_BASES = [
    'https://campanologia.org/bell-simulator/audio/',
    'https://campanologia.org/bell-simulator/sounds/',
    'https://campanologia.org/bell-simulator/mp3/',
    'https://campanologia.org/bell-simulator/'
  ];

  // Ogni builder riceve (basePath, note) e deve restituire un URL completo.
  const URL_BUILDERS = [
    (b, n) => b + encodeURIComponent(n.token) + n.octave + '.mp3',                       // DO%232.mp3
    (b, n) => b + n.token.toLowerCase().replace(/#/g, '%23') + n.octave + '.mp3',        // do%232.mp3
    (b, n) => b + n.token.replace('#', 'd') + n.octave + '.mp3',                         // DOd2.mp3
    (b, n) => b + n.token.toLowerCase().replace('#', 'd') + n.octave + '.mp3',           // dod2.mp3
    (b, n) => b + n.token.replace('#', '_diesis_') + n.octave + '.mp3',                  // DO_diesis_2.mp3
    (b, n) => b + n.token.toLowerCase().replace('#', '_diesis_') + n.octave + '.mp3',    // do_diesis_2.mp3
    (b, n) => b + n.token.replace('#', '-diesis-') + n.octave + '.mp3',                  // DO-diesis-2.mp3
    (b, n) => b + n.token.toLowerCase().replace('#', '-diesis-') + n.octave + '.mp3',    // do-diesis-2.mp3
    (b, n) => b + n.token.replace('#', 'diesis') + n.octave + '.mp3',                    // DOdiesis2.mp3
    (b, n) => b + n.token.toLowerCase().replace('#', 'diesis') + n.octave + '.mp3',      // dodiesis2.mp3
    // varianti con .ogg
    (b, n) => b + encodeURIComponent(n.token) + n.octave + '.ogg',
    (b, n) => b + n.token.toLowerCase().replace(/#/g, '%23') + n.octave + '.ogg'
  ];

  // =====================================================================
  // DEFINIZIONE NOTE
  // =====================================================================
  const SEMITONES = [
    { display: 'DO',   alt: null,    type: 'natural', token: 'DO'   },
    { display: 'DO♯',  alt: 'RE♭',  type: 'sharp',   token: 'DO#'  },
    { display: 'RE',   alt: null,    type: 'natural', token: 'RE'   },
    { display: 'RE♯',  alt: 'MI♭',  type: 'sharp',   token: 'RE#'  },
    { display: 'MI',   alt: null,    type: 'natural', token: 'MI'   },
    { display: 'FA',   alt: null,    type: 'natural', token: 'FA'   },
    { display: 'FA♯',  alt: 'SOL♭', type: 'sharp',   token: 'FA#'  },
    { display: 'SOL',  alt: null,    type: 'natural', token: 'SOL'  },
    { display: 'SOL♯', alt: 'LA♭',  type: 'sharp',   token: 'SOL#' },
    { display: 'LA',   alt: null,    type: 'natural', token: 'LA'   },
    { display: 'LA♯',  alt: 'SI♭',  type: 'sharp',   token: 'LA#'  },
    { display: 'SI',   alt: null,    type: 'natural', token: 'SI'   }
  ];

  const OCTAVES = [
    { num: 4, hint: 'campane acute' },
    { num: 3, hint: 'campane medie' },
    { num: 2, hint: 'campane gravi' }
  ];

  const BELL_LIGHT = 'https://campanologia.org/bell-simulator/img/bell-light-grey.svg';
  const BELL_DARK  = 'https://campanologia.org/bell-simulator/img/bell-dark-grey.svg';

  // =====================================================================
  // RUNTIME STATE
  // =====================================================================
  const audioCache = new Map();   // note key -> URL stringa
  const activeAudios = new Set();
  let resolvedBase = null;
  let resolvedBuilder = null;
  let resolving = null;           // promise in-flight per la prima discovery

  const statusEl = document.getElementById('status');

  function setStatus(msg, kind) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  // =====================================================================
  // PROBE / DISCOVERY
  // =====================================================================
  function probeAudio(url) {
    return new Promise(resolve => {
      const a = new Audio();
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        a.removeAttribute('src');
        try { a.load(); } catch {}
        resolve(ok);
      };
      a.addEventListener('canplaythrough', () => finish(true), { once: true });
      a.addEventListener('loadedmetadata',  () => finish(true), { once: true });
      a.addEventListener('error',           () => finish(false), { once: true });
      a.preload = 'auto';
      a.src = url;
      try { a.load(); } catch { finish(false); }
      setTimeout(() => finish(false), 4500);
    });
  }

  async function discover(probeNote) {
    for (const base of AUDIO_BASES) {
      for (const builder of URL_BUILDERS) {
        const url = builder(base, probeNote);
        if (await probeAudio(url)) {
          resolvedBase = base;
          resolvedBuilder = builder;
          console.info('[campane] formato audio rilevato:', url);
          return url;
        }
      }
    }
    return null;
  }

  async function urlFor(note) {
    if (audioCache.has(note.key)) return audioCache.get(note.key);
    if (resolvedBuilder) {
      const url = resolvedBuilder(resolvedBase, note);
      audioCache.set(note.key, url);
      return url;
    }
    if (!resolving) {
      setStatus('Cerco i file audio sul server di campanologia.org…');
      resolving = discover(note).then(url => {
        if (!url) {
          setStatus('Nessun file audio trovato. Vedi commento in cima allo script per la diagnosi.', 'error');
        } else {
          setStatus('Connesso al campanile.', 'ok');
          setTimeout(() => setStatus(''), 1800);
        }
        return url;
      });
    }
    const probedUrl = await resolving;
    if (!probedUrl) return null;
    if (!audioCache.has(note.key)) {
      const url = resolvedBuilder(resolvedBase, note);
      audioCache.set(note.key, url);
      return url;
    }
    return audioCache.get(note.key);
  }

  // =====================================================================
  // PLAYBACK
  // =====================================================================
  async function playNote(note) {
    const url = await urlFor(note);
    if (!url) return;
    const audio = new Audio(url);
    audio.volume = 0.85;
    activeAudios.add(audio);
    const drop = () => activeAudios.delete(audio);
    audio.addEventListener('ended', drop);
    audio.addEventListener('error', drop);
    audio.play().catch(e => {
      drop();
      console.warn('[campane] play failed for', url, e);
      setStatus('Riproduzione bloccata: ' + (e.message || e.name || ''), 'error');
    });
  }

  function stopAll() {
    for (const a of activeAudios) {
      try { a.pause(); a.currentTime = 0; } catch {}
    }
    activeAudios.clear();
  }

  // =====================================================================
  // RENDER
  // =====================================================================
  function buildKeyboard() {
    const keyboard = document.getElementById('keyboard');
    OCTAVES.forEach(oct => {
      const section = document.createElement('section');
      section.className = 'octave';
      section.innerHTML = `<div class="octave-label">Ottava ${oct.num}<span class="hint">— ${oct.hint}</span></div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      SEMITONES.forEach(s => {
        const note = {
          key: s.token + oct.num,
          token: s.token,
          octave: oct.num,
          display: s.display,
          alt: s.alt,
          type: s.type
        };
        const cell = document.createElement('div');
        cell.className = 'bell ' + s.type;
        cell.dataset.note = note.key;
        cell.setAttribute('role', 'button');
        cell.setAttribute('tabindex', '0');
        cell.setAttribute('aria-label', `${note.display} ottava ${oct.num}`);
        const img = s.type === 'natural' ? BELL_LIGHT : BELL_DARK;
        cell.innerHTML = `
          <img src="${img}" alt="" draggable="false">
          <div class="label">
            ${s.display}<sub>${oct.num}</sub>
            ${s.alt ? `<span class="alt">${s.alt}<sub>${oct.num}</sub></span>` : ''}
          </div>
        `;
        const trigger = () => {
          cell.classList.remove('ringing');
          // forza reflow per rilanciare l'animazione
          void cell.offsetWidth;
          cell.classList.add('ringing');
          playNote(note);
        };
        cell.addEventListener('click', trigger);
        cell.addEventListener('keydown', e => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            trigger();
          }
        });
        // pulisce la classe ringing al termine dell'animazione
        cell.addEventListener('animationend', e => {
          if (e.animationName === 'pulse') cell.classList.remove('ringing');
        });
        grid.appendChild(cell);
      });
      section.appendChild(grid);
      keyboard.appendChild(section);
    });
  }

  buildKeyboard();
  document.getElementById('stopAll').addEventListener('click', stopAll);
</script>
</body>
</html>
